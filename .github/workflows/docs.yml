name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  literate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1

      - name: Build crycco
        run: git clone --depth 1 https://github.com/ralsina/crycco /tmp/crycco

      - name: Compile crycco
        run: shards build
        working-directory: /tmp/crycco

      - name: Render literate documentation
        run: /tmp/crycco/bin/crycco src/smallpt.cr

      - name: Build index page from README
        run: |
          cp assets/render.png docs/render.png
          sed -e 's|assets/render.png|render.png|' \
              -e 's|docs/smallpt.cr.html|smallpt.cr.html|g' \
              README.md | pandoc --from gfm --standalone --output docs/index.html \
            --include-in-header .github/pico-header.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
