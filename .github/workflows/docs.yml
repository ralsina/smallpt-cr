name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  literate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1

      - name: Build crycco
        run: git clone --depth 1 https://github.com/ralsina/crycco /tmp/crycco

      - name: Compile crycco
        run: shards build
        working-directory: /tmp/crycco

      - name: Build site
        run: |
          cp assets/render.png docs/render.png
          /tmp/crycco/bin/crycco --output /tmp/site README.md src/smallpt.cr
          cp -r /tmp/site/. docs/
          mv docs/README.md.html docs/index.html
          sed -i 's|README\.md\.html|index.html|g' $(find docs -name '*.html')
          sed -i -e 's|assets/render\.png|render.png|' \
                 -e 's|docs/src/smallpt\.cr\.html|src/smallpt.cr.html|g' \
              docs/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
